<div class="auth-wrap auth-wrap-wide">
  <div class="auth-card">
    <span class="hero-tag">Galaxy Account</span>
    <h2 class="auth-title">Create an Account</h2>
    <p class="auth-subtitle">Register to access the Galaxy Store ecosystem and portal.</p>

    @if (errorMessage()) {
      <div class="alert alert-error" role="alert">
        <i class="fa-solid fa-circle-exclamation"></i> {{ errorMessage() }}
      </div>
    }
    @if (successMessage()) {
      <div class="alert alert-success" role="status">
        <i class="fa-solid fa-circle-check"></i> {{ successMessage() }}
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label class="form-label" for="fullName">Full Name</label>
        <input id="fullName" type="text" name="fullName" [(ngModel)]="fullName"
               autocomplete="name" placeholder="John Doe" class="form-control">
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input id="email" type="email" name="email" [(ngModel)]="email"
               autocomplete="email" placeholder="john@example.com" class="form-control">
      </div>

      <div class="form-group">
        <label class="form-label" for="phoneNumber">Phone Number</label>
        <input id="phoneNumber" type="tel" name="phoneNumber" [(ngModel)]="phoneNumber"
               autocomplete="tel" placeholder="+962791234567" class="form-control">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input id="password" type="password" name="password" [(ngModel)]="password"
               autocomplete="new-password" placeholder="Minimum 8 characters" class="form-control">
      </div>

      <div class="form-group">
        <label class="form-label" for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword" type="password" name="confirmPassword" [(ngModel)]="confirmPassword"
               autocomplete="new-password" placeholder="Re-enter password" class="form-control">
      </div>

      <button type="submit" class="btn btn-primary auth-submit" [disabled]="loading()" [class.btn-disabled]="loading()">
        {{ loading() ? 'Creating account...' : 'Create Account' }}
      </button>
    </form>

    <div class="auth-footer">
      Already have an account?
      <a routerLink="/login">Log in here</a>
    </div>
  </div>
</div>
